name: One-time setup consent migration
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'setup consent migration') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch profile setup consent
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/pages/ProfileSetupPage.tsx')
          s = p.read_text()
          marker = 'setup-legal-consent-v1'
          if marker in s:
              raise SystemExit(0)
          s = s.replace("const [error, setError] = useState('');", "const [error, setError] = useState('');\n  const [setupLegalAccepted, setSetupLegalAccepted] = useState(false);\n  const [setupLegalBlocked, setSetupLegalBlocked] = useState(false); // setup-legal-consent-v1")
          s = s.replace("e.preventDefault();\n    if (!user?.uid)", "e.preventDefault();\n    if (!setupLegalAccepted) { setSetupLegalBlocked(true); return; }\n    if (!user?.uid)")
          block = '''\n          <div className="rounded-2xl border border-blue-200 bg-blue-50/70 p-4">\n            <label className="flex items-start gap-3 cursor-pointer" dir="rtl">\n              <input type="checkbox" checked={setupLegalAccepted} onChange={(e) => { setSetupLegalAccepted(e.target.checked); setSetupLegalBlocked(false); }} className="mt-1 w-5 h-5 accent-blue-600 shrink-0" />\n              <span className="text-xs sm:text-sm text-slate-700 leading-6">أوافق على <button type="button" onClick={() => window.open('/legal/terms','_blank','noopener,noreferrer')} className="font-black text-blue-700 underline">شروط الاستخدام</button> و<button type="button" onClick={() => window.open('/legal/privacy','_blank','noopener,noreferrer')} className="font-black text-blue-700 underline">سياسة الخصوصية</button>، وأؤكد أن البيانات التي قدمتها صحيحة.</span>\n            </label>\n            {setupLegalBlocked && <p className="mt-2 text-xs font-black text-red-600">لا يمكن إنهاء إعداد الحساب قبل الموافقة على الشروط والخصوصية.</p>}\n          </div>\n'''
          s = s.replace('</form>', block + '</form>', 1)
          p.write_text(s)
          PY
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/ProfileSetupPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: enforce setup consent confirmation"
          git push