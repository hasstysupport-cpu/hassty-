name: Fix admin Supabase session hydration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch admin session hydration
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/admin/HasstyAdminApp.tsx')
          s = p.read_text(encoding='utf-8')

          if "import { supabase } from '../../lib/supabase';" not in s:
              s = s.replace(
                  "import { auth } from '../../lib/supabaseAuthCompat';\n",
                  "import { auth } from '../../lib/supabaseAuthCompat';\nimport { supabase } from '../../lib/supabase';\n",
                  1,
              )

          old = """    async function initRealtimeSync(){ try {
      await seedAdminDatabaseIfEmpty();
      unsubUsers=subscribeToUsers(data=>{setAccounts(data);setDbConnectionStatus('connected');setDbErrorMessage(null);setIsDbLoading(false)},err=>{console.warn('Supabase Users fallback triggered:',err);setDbConnectionStatus('connected');setIsDbLoading(false)});"""
          new = """    async function initRealtimeSync(){ try {
      if (!supabase) throw new Error('Supabase is not configured');
      let { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        const refreshed = await supabase.auth.refreshSession();
        session = refreshed.data.session;
        if (refreshed.error) throw refreshed.error;
      }
      if (!session?.user) throw new Error('جلسة Supabase الإدارية غير متاحة. سجّل دخول الأدمن مرة أخرى.');
      const { data: adminProfile, error: adminProfileError } = await supabase.from('profiles').select('id,role,email').eq('id', session.user.id).maybeSingle();
      if (adminProfileError) throw adminProfileError;
      const isAdmin = adminProfile?.role === 'admin' || (session.user.email || '').toLowerCase() === 'hasstysupport@gmail.com';
      if (!isAdmin) throw new Error('الحساب الحالي ليس حساب إدارة معتمد.');
      await seedAdminDatabaseIfEmpty();
      unsubUsers=subscribeToUsers(data=>{setAccounts(data);setDbConnectionStatus('connected');setDbErrorMessage(null);setIsDbLoading(false)},err=>{console.warn('Supabase Users sync failed:',err);setDbConnectionStatus('failed');setDbErrorMessage(err instanceof Error ? err.message : 'تعذر قراءة بيانات الحسابات من Supabase.');setIsDbLoading(false)});"""
          if old not in s:
              raise SystemExit('expected admin sync block not found')
          s = s.replace(old, new, 1)

          s = s.replace(
              "unsubVerifs=subscribeToVerifications(data=>setVerificationRequests(data),err=>console.warn('Supabase Verifications fallback triggered:',err));",
              "unsubVerifs=subscribeToVerifications(data=>setVerificationRequests(data),err=>{console.warn('Supabase Verifications sync failed:',err);setDbConnectionStatus('failed');setDbErrorMessage(err instanceof Error ? err.message : 'تعذر قراءة طلبات التوثيق.');});",
              1,
          )
          s = s.replace(
              "unsubReports=subscribeToReports(data=>setSafetyReports(data),err=>console.warn('Supabase Reports fallback triggered:',err));",
              "unsubReports=subscribeToReports(data=>setSafetyReports(data),err=>{console.warn('Supabase Reports sync failed:',err);setDbConnectionStatus('failed');setDbErrorMessage(err instanceof Error ? err.message : 'تعذر قراءة البلاغات.');});",
              1,
          )
          s = s.replace(
              "unsubComms=subscribeToCommissions(data=>setCommissions(data),err=>console.warn('Supabase Commissions fallback triggered:',err));",
              "unsubComms=subscribeToCommissions(data=>setCommissions(data),err=>{console.warn('Supabase Commissions sync failed:',err);setDbConnectionStatus('failed');setDbErrorMessage(err instanceof Error ? err.message : 'تعذر قراءة العمولات.');});",
              1,
          )

          p.write_text(s, encoding='utf-8')

      - name: Commit patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/HasstyAdminApp.tsx
          git commit -m "fix: hydrate admin Supabase session before queries" --allow-empty
          git rm .github/workflows/fix-admin-supabase-session.yml
          git commit -m "chore: remove one-time admin session patch workflow"
          git push origin HEAD:main
