name: Fix auth stability

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'chore: remove auth stability workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch AuthContext
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/AuthContext.tsx')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
              "return value === 'student' || value === 'parent' || value === 'teacher' || value === 'admin' ? value : null;",
              "return value === 'student' || value === 'parent' || value === 'teacher' || value === 'assistant' || value === 'admin' ? value : null;"
          )

          old = '''      try {
        const { data } = await supabase.auth.getUser();
        if (!mounted) return;
        if (!data.user) {
          persistSession(null);
          setLoading(false);
          return;
        }
        const session = await buildSession(data.user);
        if (mounted) persistSession(session);
      } catch (error) {
        console.warn('Auth hydration warning:', error);
        if (mounted) persistSession(null);
      } finally {'''
          new = '''      try {
        const { data, error } = await supabase.auth.getSession();
        if (!mounted) return;
        if (error) throw error;
        if (!data.session?.user) {
          persistSession(null);
          setLoading(false);
          return;
        }
        const session = await buildSession(data.session.user);
        if (mounted) persistSession(session);
      } catch (error) {
        console.warn('Auth hydration warning:', error);
        try {
          const stored = typeof window !== 'undefined' ? localStorage.getItem('hassty_user_session') : null;
          const parsed = stored ? JSON.parse(stored) : null;
          if (mounted && parsed?.uid) persistSession(parsed as UserSession);
        } catch {}
      } finally {'''
          if old not in s:
              raise SystemExit('hydrate block not found')
          s = s.replace(old, new, 1)

          old = '''    const profile = await upsertProfile(authData.user.id, {
      email: cleanEmail,
      full_name: cleanName,
      phone: cleanPhone,
      role: data.role,
      avatar_url: data.avatarUrl || null,
      governorate: data.governorate || null,
      city: data.area || null,
      grade: data.grade || null,
      account_status: 'active',
      metadata,
    });

    if (data.role === 'student') {
      const qrCode = `HASSTY-${authData.user.id.replace(/-/g, '').slice(0, 10).toUpperCase()}`;
      await upsertProfile(authData.user.id, { qr_code: qrCode, metadata: { ...metadata, qrCode } });
    }

    if (data.role === 'teacher') {'''
          new = '''    const hasActiveSession = Boolean(authData.session);
    let profile: any = {
      id: authData.user.id,
      email: cleanEmail,
      full_name: cleanName,
      phone: cleanPhone,
      role: data.role,
      avatar_url: data.avatarUrl || null,
      governorate: data.governorate || null,
      city: data.area || null,
      grade: data.grade || null,
      account_status: 'active',
      badge: null,
      qr_code: null,
      metadata,
    };

    if (hasActiveSession) {
      profile = await upsertProfile(authData.user.id, profile);
    } else {
      try {
        const provisioned = await getProfile(authData.user.id);
        if (provisioned) profile = provisioned;
      } catch {}
    }

    if (data.role === 'student' && hasActiveSession) {
      const qrCode = `HASSTY-${authData.user.id.replace(/-/g, '').slice(0, 10).toUpperCase()}`;
      await upsertProfile(authData.user.id, { qr_code: qrCode, metadata: { ...metadata, qrCode } });
      profile = { ...profile, qr_code: qrCode, metadata: { ...metadata, qrCode } };
    }

    if (data.role === 'teacher' && hasActiveSession) {'''
          if old not in s:
              raise SystemExit('signup block not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Patch and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/AuthContext.tsx
          git commit -m "fix: stabilize supabase auth sessions and signup flow"
          git rm .github/workflows/fix-auth-stability.yml
          git commit -m "chore: remove auth stability workflow"
          git push origin HEAD:main
