name: Build HASSTY Remotion Ad

on:
  push:
    branches: [remotion-hassty-ad]
    paths:
      - 'remotion-ad/**'
      - '.github/workflows/build-hassty-remotion-ad.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remotion-ad
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remotion-ad/package.json
      - name: Install
        run: npm install
      - name: Render MP4
        run: npm run build
      - name: Upload rendered video
        uses: actions/upload-artifact@v4
        with:
          name: hassty-remotion-ad
          path: remotion-ad/out/hassty-ad.mp4
