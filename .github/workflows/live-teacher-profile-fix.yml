name: Wire live teacher profile actions
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin badge and teacher actions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/lib/adminSupabaseService.ts')
          s = p.read_text()
          old = r'''export async function dbUpdateAccountBadge\(accountId: string, newBadge: AccountBadgeType\) \{.*?\n\}'''
          new = '''export async function dbUpdateAccountBadge(accountId: string, newBadge: AccountBadgeType) {
            const client = requireSupabase();
            const { error } = await client.rpc('admin_update_account_badge', {
              target_user_id: accountId,
              new_badge: newBadge,
            });
            if (error) throw error;
          }'''
          s2, n = re.subn(old, new, s, flags=re.S)
          if n != 1:
            raise SystemExit('badge function patch did not match exactly')
          p.write_text(s2)

          p = Path('src/pages/TeacherProfilePage.tsx')
          s = p.read_text()
          s = s.replace("import { useSEO } from '../lib/useSEO';", "import { useSEO } from '../lib/useSEO';\nimport { supabase } from '../lib/supabase';\nimport { useAuth } from '../lib/AuthContext';")
          s = s.replace("  MessageSquare,\n", "  MessageSquare,\n  Flag,\n  Send,\n")
          marker = "  const [isBookingModalOpen, setIsBookingModalOpen] = useState(false);"
          inject = """  const [isBookingModalOpen, setIsBookingModalOpen] = useState(false);\n  const { user } = useAuth();\n  const [liveReviews, setLiveReviews] = useState<any[]>([]);\n  const [reviewOpen, setReviewOpen] = useState(false);\n  const [reportOpen, setReportOpen] = useState(false);\n  const [reviewRating, setReviewRating] = useState(5);\n  const [reviewComment, setReviewComment] = useState('');\n  const [reportCategory, setReportCategory] = useState('other');\n  const [reportDetails, setReportDetails] = useState('');\n  const [actionMessage, setActionMessage] = useState('');\n  const [actionBusy, setActionBusy] = useState(false);"""
          if marker not in s: raise SystemExit('state marker missing')
          s = s.replace(marker, inject)

          fetch_marker = "  // Related tutors"
          effect = r'''  useEffect(() => {
    let active = true;
    const loadReviews = async () => {
      if (!supabase || !tutorId) return;
      const { data, error } = await supabase
        .from('tutor_reviews')
        .select('id,rating,comment,created_at,student_id,reply_text,teaching_quality,punctuality,behavior,value_for_money,verified_session')
        .eq('tutor_id', tutorId)
        .eq('verified_session', true)
        .order('created_at', { ascending: false });
      if (!active || error) return;
      setLiveReviews(data || []);
    };
    void loadReviews();
    return () => { active = false; };
  }, [tutorId]);

  const submitLiveReview = async () => {
    if (!supabase || !user?.uid) { setActionMessage('سجّل الدخول أولًا لكتابة تقييم.'); return; }
    setActionBusy(true); setActionMessage('');
    try {
      const { error } = await supabase.rpc('submit_tutor_review', {
        p_tutor_id: tutorId,
        p_booking_id: null,
        p_rating: reviewRating,
        p_comment: reviewComment,
        p_teaching_quality: reviewRating,
        p_punctuality: reviewRating,
        p_behavior: reviewRating,
        p_value_for_money: reviewRating,
      });
      if (error) throw error;
      setReviewOpen(false); setReviewComment(''); setActionMessage('تم إرسال تقييمك بنجاح ✅');
      const { data } = await supabase.from('tutor_reviews').select('id,rating,comment,created_at,student_id,reply_text,verified_session').eq('tutor_id', tutorId).eq('verified_session', true).order('created_at', { ascending: false });
      setLiveReviews(data || []);
    } catch (e:any) { setActionMessage(e?.message || 'تعذر إرسال التقييم.'); }
    finally { setActionBusy(false); }
  };

  const submitLiveReport = async () => {
    if (!supabase || !user?.uid) { setActionMessage('سجّل الدخول أولًا لإرسال بلاغ.'); return; }
    setActionBusy(true); setActionMessage('');
    try {
      const { error } = await supabase.rpc('submit_tutor_report', { p_tutor_id: tutorId, p_category: reportCategory, p_details: reportDetails });
      if (error) throw error;
      setReportOpen(false); setReportDetails(''); setActionMessage('تم إرسال البلاغ للإدارة للمراجعة ✅');
    } catch (e:any) { setActionMessage(e?.message || 'تعذر إرسال البلاغ.'); }
    finally { setActionBusy(false); }
  };

'''
          if fetch_marker not in s: raise SystemExit('effect marker missing')
          s = s.replace(fetch_marker, effect + fetch_marker)

          # Replace fake rating breakdown with real reviews average.
          s = s.replace("  const ratingBreakdown = [\n    { stars: 5, percentage: 88, count: Math.round(tutor.reviewsCount * 0.88) },\n    { stars: 4, percentage: 9, count: Math.round(tutor.reviewsCount * 0.09) },\n    { stars: 3, percentage: 2, count: Math.round(tutor.reviewsCount * 0.02) },\n    { stars: 2, percentage: 1, count: Math.round(tutor.reviewsCount * 0.01) },\n    { stars: 1, percentage: 0, count: 0 },\n  ];", "  const effectiveReviews = liveReviews.length ? liveReviews : (tutor.reviews || []);\n  const ratingBreakdown = [5,4,3,2,1].map((stars) => { const count = effectiveReviews.filter((r:any) => Number(r.rating) === stars).length; return { stars, count, percentage: effectiveReviews.length ? Math.round(count * 100 / effectiveReviews.length) : 0 }; });")

          # Add action card immediately before left-column QR card.
          anchor = "            {/* Prominent QR Code Join Box */}"
          card = r'''            {actionMessage && <div className="bg-emerald-50 border border-emerald-200 rounded-2xl p-3 text-xs font-bold text-emerald-800">{actionMessage}</div>}
            <div className="bg-white border border-slate-200 rounded-3xl p-5 shadow-sm space-y-3">
              <div className="flex items-center justify-between gap-2">
                <h3 className="text-sm font-black text-slate-900">تقييم وإبلاغ</h3>
                <span className="text-[11px] font-bold text-slate-400">إدارة آمنة عبر المنصة</span>
              </div>
              <button onClick={() => setReviewOpen(v => !v)} className="w-full rounded-2xl bg-blue-600 text-white px-4 py-3 text-sm font-black flex items-center justify-center gap-2"><Star className="w-4 h-4"/> اكتب تقييمًا</button>
              <button onClick={() => setReportOpen(v => !v)} className="w-full rounded-2xl bg-white border border-red-200 text-red-700 px-4 py-3 text-sm font-black flex items-center justify-center gap-2"><Flag className="w-4 h-4"/> إبلاغ عن المدرس</button>
              {reviewOpen && <div className="space-y-3 pt-2 border-t border-slate-100">
                <div className="flex gap-1 justify-center">{[1,2,3,4,5].map(star => <button type="button" key={star} onClick={() => setReviewRating(star)}><Star className={`w-6 h-6 ${star <= reviewRating ? 'text-amber-500 fill-amber-400' : 'text-slate-300'}`}/></button>)}</div>
                <textarea value={reviewComment} onChange={e => setReviewComment(e.target.value)} maxLength={2000} placeholder="اكتب تجربتك بعد الحصة..." className="w-full min-h-24 rounded-2xl border border-slate-200 p-3 text-sm outline-none"/>
                <button disabled={actionBusy} onClick={submitLiveReview} className="w-full rounded-2xl bg-slate-900 text-white px-4 py-3 text-sm font-black flex items-center justify-center gap-2"><Send className="w-4 h-4"/> {actionBusy ? 'جارٍ الإرسال...' : 'إرسال التقييم'}</button>
              </div>}
              {reportOpen && <div className="space-y-3 pt-2 border-t border-slate-100">
                <select value={reportCategory} onChange={e => setReportCategory(e.target.value)} className="w-full rounded-2xl border border-slate-200 p-3 text-sm font-bold"><option value="other">أخرى</option><option value="inappropriate_conduct">سلوك غير مناسب</option><option value="external_payment_demand">طلب دفع خارج المنصة</option><option value="absence_no_notice">غياب بدون إخطار</option><option value="verbal_abuse">إساءة لفظية</option></select>
                <textarea value={reportDetails} onChange={e => setReportDetails(e.target.value)} maxLength={3000} placeholder="اكتب تفاصيل البلاغ بوضوح..." className="w-full min-h-24 rounded-2xl border border-slate-200 p-3 text-sm outline-none"/>
                <button disabled={actionBusy} onClick={submitLiveReport} className="w-full rounded-2xl bg-red-600 text-white px-4 py-3 text-sm font-black">{actionBusy ? 'جارٍ الإرسال...' : 'إرسال البلاغ'}</button>
              </div>}
            </div>
'''
          if anchor not in s: raise SystemExit('action anchor missing')
          s = s.replace(anchor, card + anchor, 1)

          # Use real review count where possible.
          s = s.replace("({tutor.reviewsCount} تقييم حقيقي)", "({liveReviews.length || tutor.reviewsCount} تقييم موثق)")
          s = s.replace("بناءً على {tutor.reviewsCount} تقييم موثق", "بناءً على {effectiveReviews.length} تقييم موثق")
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/live-teacher-profile-fix.yml
          git add src/lib/adminSupabaseService.ts src/pages/TeacherProfilePage.tsx .github/workflows/live-teacher-profile-fix.yml
          git commit -m "fix: wire live teacher badges reviews and reports" || exit 0
          git push
