name: Wire teacher badge bridge
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin badge service
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/lib/adminSupabaseService.ts')
          s = p.read_text()
          pattern = r"export async function dbUpdateAccountBadge\(accountId: string, newBadge: AccountBadgeType\)[\s\S]*?\n}\n"
          replacement = '''export async function dbUpdateAccountBadge(accountId: string, newBadge: AccountBadgeType) {
            const client = requireSupabase();
            const { error } = await client.rpc('admin_update_account_badge', {
              target_user_id: accountId,
              new_badge: newBadge,
            });
            if (error) throw error;
          }
'''
          s2, count = re.subn(pattern, replacement, s, count=1)
          if count != 1:
            raise SystemExit('dbUpdateAccountBadge function was not found exactly once')
          p.write_text(s2)
          PY
          rm -f .github/workflows/live-teacher-profile-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/adminSupabaseService.ts .github/workflows/live-teacher-profile-fix.yml
          git commit -m "fix: use atomic Supabase badge update" || exit 0
          git push